[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redireciona /api/* para as Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback (o app é single-page)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
